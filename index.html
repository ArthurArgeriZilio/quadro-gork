<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro</title>
<script>
(function(){
  try {
    var t = localStorage.getItem("quadro.theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
  document.documentElement.style.colorScheme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 8 8%22 shape-rendering=%22crispEdges%22%3E%3Crect width=%228%22 height=%228%22/%3E%3Crect x=%221%22 y=%221%22 width=%226%22 height=%226%22 fill=%22%23fff%22/%3E%3Crect x=%222%22 y=%222%22 width=%221%22 height=%221%22/%3E%3Crect x=%224%22 y=%223%22 width=%222%22 height=%221%22/%3E%3Crect x=%222%22 y=%225%22 width=%224%22 height=%221%22/%3E%3C/svg%3E">
<style>
/* Tema escuro é o padrão. O claro só troca as variáveis — o desenho da página não muda. */
:root{
  color-scheme:dark;
  --mono:"Consolas","Menlo","Monaco","DejaVu Sans Mono","Liberation Mono","Courier New",monospace;
  --z:1;
  --bg:#0e0e10;
  --surface:#18181b;
  --surface-2:#1f1f23;
  --line:#2a2a2e;
  --ink:#e6e6e6;
  --muted:#9a9aa0;
  --accent:#8ea2ff;
  --ok:#8fbfa0;
  --on-bg:#8ea2ff;
  --on-ink:#0e0e10;
  --card:#1c1c21;
  --card-ink:#e6e6e6;
  --card-branco:#222228;
  --card-pontilhado:#1b2230;
  --card-denso:#261c28;
  --card-listras:#1a2620;
  --card-preto:#0c0c0f;
  --card-preto-ink:#f3e6e6;
  --urgent:#e06b6b;
  --preto-bar:#e06b6b;
  --preto-ring:0 0 0 1px #e06b6b;
  --tag-bg:#2a2a30;
  --tag-ink:#e6e6e6;
  --input:#141417;
  --input-ink:#e6e6e6;
  --input-border:1px solid #2a2a2e;
  --note-chip:#141418;
  --note-chip-ink:#e6e6e6;
  --link:#b7c0ff;
  --ants:#c8c8d0;
  --ants-base:#18181b;
  --pan-bg:#8ea2ff;
  --pan-ink:#0e0e10;
  --dlg-mask:rgba(8,8,10,.72);
  --bd:0 0 0 1px #2a2a2e;
  --bd2:0 0 0 1px #2a2a2e;
  --drop:0 8px 22px rgba(0,0,0,.35);
  --drop-drag:0 14px 30px rgba(0,0,0,.45);
  --drop-tools:0 6px 16px rgba(0,0,0,.4);
  --bar-border:1px solid #2a2a2e;
  --section-border:1px solid #2a2a2e;
  --radius:12px;
  --radius-sm:8px;
  --radius-btn:6px;
  --focus-gap:#18181b;
  --focus-ring:#8ea2ff;
  --cursor-ring:#e6e6e6;
  --cursor-gap:#0e0e10;
  --cb-border:2px solid #e6e6e6;
  --pat-on:2px solid #8ea2ff;
  --hair:2px;
  --swatch-branco:var(--card-branco);
  --swatch-pontilhado:var(--card-pontilhado) var(--pt-light) 0 0/8px 8px;
  --swatch-denso:var(--card-denso) var(--pt-dense) 0 0/4px 4px;
  --swatch-listras:var(--card-listras) var(--pt-stripe) 0 0/8px 8px;
  --swatch-preto:var(--card-preto);
  scrollbar-color:#3a3a42 #0e0e10;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#fff;
  --surface:#fff;
  --surface-2:#fff;
  --line:#000;
  --ink:#000;
  --muted:#000;
  --accent:#000;
  --ok:#127a3a;
  --on-bg:#000;
  --on-ink:#fff;
  --card:#fff;
  --card-ink:#000;
  --card-branco:#fff;
  --card-pontilhado:#fff;
  --card-denso:#fff;
  --card-listras:#fff;
  --card-preto:#000;
  --card-preto-ink:#fff;
  --urgent:#fff;
  --preto-bar:#fff;
  --preto-ring:inset 0 0 0 2px #fff;
  --tag-bg:#fff;
  --tag-ink:#000;
  --input:#fff;
  --input-ink:#000;
  --input-border:3px solid #000;
  --note-chip:#fff;
  --note-chip-ink:#000;
  --link:#000;
  --ants:#000;
  --ants-base:#fff;
  --pan-bg:#000;
  --pan-ink:#fff;
  --dlg-mask:transparent;
  --bd:-3px 0 0 #000,3px 0 0 #000,0 -3px 0 #000,0 3px 0 #000;
  --bd2:-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000,0 2px 0 #000;
  --drop:7px 7px 0 #000;
  --drop-drag:12px 12px 0 #000;
  --drop-tools:4px 4px 0 #000;
  --bar-border:3px solid #000;
  --section-border:3px solid #000;
  --radius:0px;
  --radius-sm:0px;
  --radius-btn:0px;
  --focus-gap:#fff;
  --focus-ring:#000;
  --cursor-ring:#000;
  --cursor-gap:#fff;
  --cb-border:3px solid #000;
  --pat-on:3px solid #000;
  --hair:2px;
  scrollbar-color:auto;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:13px/1.3 var(--mono);
  -webkit-font-smoothing:none;font-smooth:never;user-select:none;-webkit-user-select:none;image-rendering:pixelated}
html{background:var(--bg)}
body{background:var(--bg) var(--pt-dense) 0 0/4px 4px}
svg{shape-rendering:crispEdges;display:block}
button{font:inherit;color:inherit}
.pwin{position:fixed;background:var(--surface);color:var(--ink);box-shadow:var(--bd),var(--drop);border-radius:var(--radius)}
.tbar{height:23px;display:flex;align-items:center;justify-content:center;border-bottom:var(--bar-border);
  background:var(--surface) var(--pt-mac) 0 0/2px 4px;background-clip:content-box;padding:3px 4px;position:relative}
.tbar .ttl{background:var(--surface);color:var(--ink);padding:0 6px;height:14px;display:flex;align-items:center}

/* ---------- barra de menu */
#menubar{position:fixed;left:0;right:0;top:0;height:36px;background:var(--surface);color:var(--ink);border-bottom:var(--bar-border);display:flex;align-items:center;gap:6px;padding:0 10px;z-index:50}
#menubar .logo{display:flex;align-items:center;gap:8px;padding-right:12px;margin-right:4px;border-right:var(--bar-border);height:100%}
#stats{display:flex;align-items:center;padding-left:6px}
.spacer{flex:1}
.mbtn{height:24px;min-width:26px;padding:0 5px;border:none;background:var(--surface);color:var(--ink);border-radius:var(--radius-btn);display:flex;align-items:center;justify-content:center;cursor:pointer}
.mbtn:hover{background:var(--surface) var(--pt-light) 0 0/8px 8px}
.mbtn:active{background:var(--on-bg);color:var(--on-ink)}
.mgroup{display:flex;align-items:center;gap:2px;padding:2px;box-shadow:var(--bd2);margin:0 6px;border-radius:var(--radius-btn)}
#zoomlbl{min-width:46px}
#status{display:flex;align-items:center;gap:7px;padding:0 4px 0 8px;font-weight:bold;font-size:12px;text-transform:uppercase;white-space:nowrap}
#led{width:12px;height:12px;background:var(--ink);box-shadow:var(--bd2);margin:2px}
#status.saving #led{background:var(--surface) var(--pt-dense) 0 0/4px 4px;animation:blink .5s steps(1) infinite}
#status.off #led{background:var(--surface) var(--pt-x) 0 0/12px 12px}
@keyframes blink{50%{background:var(--surface)}}

/* ---------- paleta */
#palette{left:12px;top:52px;width:84px;z-index:40}
#palette .grid{display:grid;grid-template-columns:repeat(2,36px);gap:4px;padding:6px 4px 4px}
#palette .sect{border-top:var(--section-border);margin-top:4px}
#palette .lbl{padding:6px 0 0 6px;display:flex;color:var(--muted)}
.pbtn{width:36px;height:36px;border:none;background:var(--surface);color:var(--ink);border-radius:var(--radius-btn);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--line)}
.pbtn:hover{background:var(--surface) var(--pt-light) 0 0/8px 8px}
.pbtn.on{background:var(--on-bg);color:var(--on-ink)}
.pbtn .sz{background:currentColor;display:block}
.patb{width:36px;height:22px;cursor:pointer;border:none;padding:0;border-radius:var(--radius-btn);box-shadow:inset 0 0 0 2px var(--line)}
.patb.on{outline:var(--pat-on);outline-offset:1px}

/* ---------- janela do quadro */
#boardwin{left:114px;top:52px;right:16px;bottom:54px;z-index:10}
#viewport{position:absolute;left:0;right:0;top:26px;bottom:0;overflow:hidden;touch-action:none;
  background:var(--bg) var(--pt-grid) 0 0/calc(var(--z)*16px) calc(var(--z)*16px);cursor:var(--cur-arrow) 0 0,default}
#viewport.nogrid{background-image:none}
#viewport.tool-pen,#viewport.tool-link{cursor:var(--cur-cross) 7 7,crosshair}
#viewport.tool-erase{cursor:none}
#viewport.space,#viewport.space .item,#viewport.space .win,#viewport.space .paper,#viewport.space .llabel,
#viewport.tool-pan,#viewport.tool-pan .item,#viewport.tool-pan .win,#viewport.tool-pan .paper,#viewport.tool-pan .llabel{cursor:grab !important}
#viewport.panning,#viewport.panning .item,#viewport.panning .win,#viewport.panning .paper,#viewport.panning .llabel{cursor:grabbing !important}
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.moving{will-change:transform}
#inkworld,#inklinks{position:absolute;left:0;top:0;pointer-events:none;image-rendering:pixelated}
#linksvg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#linksvg .hit{fill:none;stroke:transparent;pointer-events:stroke;stroke-linecap:butt;stroke-linejoin:round}
#linksvg .wire{fill:none;pointer-events:none;stroke-linecap:butt;stroke-linejoin:round}
#linksvg .head{pointer-events:none}
#linksvg g.sel .wire,#linksvg g.sel .head{filter:brightness(1.45)}
.linktools{position:absolute;z-index:100002;display:flex;gap:4px;align-items:center;padding:3px;background:var(--surface);color:var(--ink);box-shadow:var(--bd2);border-radius:var(--radius-sm);transform:translate(-50%,-130%);pointer-events:auto}
.linktools .linkx{width:16px;height:16px;border:none;padding:0;cursor:pointer;background:var(--surface);color:var(--ink);font:bold 14px/1 var(--mono);box-shadow:inset 0 0 0 2px var(--line);border-radius:var(--radius-btn)}
.linktools .linkpal{display:flex;gap:3px}
.linktools .sw{width:14px;height:14px;border:none;padding:0;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);border-radius:3px}
.linktools .sw.on{outline:2px solid var(--ink);outline-offset:1px}
#viewport:not(.tool-select) .item{pointer-events:none}
#viewport:not(.tool-select) .tools,#viewport.multi .tools{display:none}

/* ---------- itens */
.item{position:absolute;touch-action:none;contain:layout style}
.item.new{animation:pop .18s steps(3)}
@keyframes pop{from{transform:translate(0,6px)}}
.item.selected::after,#marq{content:"";position:absolute;inset:-9px;pointer-events:none;
  background-image:linear-gradient(90deg,var(--ants) 50%,transparent 50%),linear-gradient(90deg,var(--ants) 50%,transparent 50%),linear-gradient(0deg,var(--ants) 50%,transparent 50%),linear-gradient(0deg,var(--ants) 50%,transparent 50%);
  background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;background-size:8px 2px,8px 2px,2px 8px,2px 8px;
  background-position:0 0,0 100%,0 0,100% 0;animation:ants .6s steps(4) infinite}
@keyframes ants{to{background-position:8px 0,-8px 100%,0 -8px,100% 8px}}
#marq{position:fixed;display:none;inset:auto;z-index:60}

.task{width:240px}
.task .win{background:var(--card);color:var(--card-ink);box-shadow:var(--bd),var(--drop);border-radius:var(--radius-sm);cursor:grab}
.task.p-branco .win{background:var(--card-branco)}
.task.p-pontilhado .win{background:var(--card-pontilhado)}
.task.p-denso .win{background:var(--card-denso)}
.task.p-listras .win{background:var(--card-listras)}
.task.dragging .win,.note.dragging .paper{transform:translate(-3px,-3px)}
.task.dragging .win{box-shadow:var(--bd),var(--drop-drag)}
.task .bar{height:20px;border-bottom:var(--bar-border);display:flex;align-items:center;justify-content:center;position:relative;padding:0 24px}
.task.p-branco .bar{background:var(--card-branco) var(--pt-mac) 0 1px/2px 4px}
.task.p-pontilhado .bar{background:var(--card-pontilhado) var(--pt-light) 0 0/8px 8px}
.task.p-denso .bar{background:var(--card-denso) var(--pt-dense) 0 0/4px 4px}
.task.p-listras .bar{background:var(--card-listras) var(--pt-stripe) 0 0/8px 8px}
.task.p-preto .bar{background:var(--card-preto);border-bottom-color:var(--preto-bar)}
.tag{background:var(--tag-bg);color:var(--tag-ink);padding:0 6px;font-size:11px;font-weight:bold;line-height:14px;text-transform:uppercase;outline:none;white-space:nowrap;max-width:180px;overflow:hidden;cursor:text;border-radius:var(--radius-btn)}
.tag:empty{display:none}
.tag.editing{display:block;min-width:40px}
.task .body{position:relative;padding:9px 10px 11px}
.task .row{display:flex;gap:9px;align-items:flex-start}
.cb,.scb{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;flex:none;border:var(--cb-border);background:var(--input);cursor:pointer;border-radius:var(--radius-btn)}
.cb:checked,.scb:checked{background:var(--input) var(--ck) center/12px 12px no-repeat}
.cb:hover,.scb:hover{box-shadow:2px 2px 0 var(--line)}
.title{flex:1;font-weight:bold;font-size:14px;line-height:1.3;white-space:pre-wrap;word-break:break-word;min-height:18px;outline:none;cursor:text}
.tnotes{margin:6px 0 0 27px;font-size:12px;line-height:1.35;white-space:pre-wrap;word-break:break-word;outline:none;cursor:text}
.tnotes:empty{display:none}
.tnotes.editing:empty{display:block;min-height:16px}
.tlog{display:none;margin:6px 0 0;padding:5px 7px;border:2px dashed var(--line);font-size:12px;line-height:1.35;white-space:pre-wrap;word-break:break-word;outline:none;min-height:22px;cursor:text;background:var(--input);color:var(--input-ink);border-radius:var(--radius-btn)}
.task.done .tlog,.task.has-log .tlog,.tlog.editing{display:block}
.task.p-preto .tlog{background:var(--card-preto);color:var(--card-preto-ink);border-color:var(--preto-bar)}
.task.p-preto .tlog.editing{background:var(--input);color:var(--input-ink);border-color:var(--line)}
.thist{margin:6px 0 0 27px;position:relative;z-index:1}
.hrow{display:flex;gap:6px;align-items:flex-start;margin-top:3px;font-size:11px;line-height:1.35}
.hwhen{flex:none;font-weight:bold;color:var(--muted)}
.htext{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;cursor:text}
.hdel,.sdel{flex:none;width:14px;height:14px;border:none;padding:0;background:var(--tag-bg);color:var(--tag-ink);box-shadow:inset 0 0 0 2px var(--line);font:bold 11px/14px var(--mono);cursor:pointer;opacity:0;border-radius:var(--radius-btn)}
.hrow:hover .hdel,.hrow:focus-within .hdel,.srow:hover .sdel,.srow:focus-within .sdel{opacity:1}
.hdel:hover,.sdel:hover{background:var(--on-bg);color:var(--on-ink)}
.hadd,.hmore,.sadd{display:inline-block;margin-top:4px;border:none;background:var(--tag-bg);color:var(--tag-ink);box-shadow:inset 0 0 0 2px var(--line);font:bold 11px/16px var(--mono);padding:0 6px;cursor:pointer;border-radius:var(--radius-btn)}
.hmore{margin-right:4px}
.hadd:hover,.hmore:hover,.sadd:hover{background:var(--on-bg);color:var(--on-ink)}
.hcompose,.scompose{margin-top:4px;padding:4px 6px;border:2px dashed var(--line);font-size:12px;line-height:1.35;white-space:pre-wrap;word-break:break-word;outline:none;min-height:20px;background:var(--input);color:var(--input-ink);border-radius:var(--radius-btn)}
.task.p-preto .hcompose,.task.p-preto .scompose{background:var(--card-preto);color:var(--card-preto-ink);border-color:var(--preto-bar)}
.task.p-preto .hcompose.editing,.task.p-preto .scompose.editing{background:var(--input);color:var(--input-ink);border-color:var(--line)}
.subs{margin:6px 0 0 27px;position:relative;z-index:1}
.subhead{display:flex;align-items:center;min-height:16px}
.subcount{font-size:11px;font-weight:bold;color:var(--muted)}
.subcount.all{color:var(--ok)}
.srow{display:flex;gap:6px;align-items:flex-start;margin-top:3px}
.stext{flex:1;min-width:0;font-size:12px;line-height:1.35;white-space:pre-wrap;word-break:break-word;cursor:text}
.srow.done .stext{text-decoration:line-through;text-decoration-thickness:2px}
.task.done .htext,.task.done .hwhen{background:var(--card);padding:0 2px}
.task.p-branco.done .htext,.task.p-branco.done .hwhen{background:var(--card-branco)}
.task.p-pontilhado.done .htext,.task.p-pontilhado.done .hwhen{background:var(--card-pontilhado)}
.task.p-denso.done .htext,.task.p-denso.done .hwhen{background:var(--card-denso)}
.task.p-listras.done .htext,.task.p-listras.done .hwhen{background:var(--card-listras)}
.task.p-preto.done .htext,.task.p-preto.done .hwhen{background:var(--card-preto);color:var(--card-preto-ink)}
.atts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:flex-start}
.atts:empty{display:none}
.att{position:relative;display:flex;align-items:flex-start}
.att-img{display:block;box-shadow:inset 0 0 0 2px var(--line);background:var(--tag-bg);border-radius:var(--radius-btn)}
.att-thumb{display:block;width:48px;height:48px;object-fit:cover;image-rendering:pixelated;filter:grayscale(1) contrast(2.4);background:var(--tag-bg)}
.att-chip{display:flex;align-items:center;gap:5px;max-width:160px;padding:3px 16px 3px 5px;background:var(--tag-bg);box-shadow:inset 0 0 0 2px var(--line);color:var(--tag-ink);text-decoration:none;font-size:11px;font-weight:bold;line-height:1.2;border-radius:var(--radius-btn)}
.att-chip:hover{background:var(--on-bg);color:var(--on-ink)}
.att-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-x{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border:none;padding:0;background:var(--tag-bg);color:var(--tag-ink);box-shadow:inset 0 0 0 2px var(--line);font:bold 11px/14px var(--mono);cursor:pointer;z-index:2;border-radius:var(--radius-btn)}
.att-x:hover{background:var(--on-bg);color:var(--on-ink)}
.item.drop-att .win,.item.drop-att .paper{outline:3px dashed var(--line);outline-offset:3px}
.task.done .title{text-decoration:line-through;text-decoration-thickness:2px}
.task .row,.task .tnotes{position:relative;z-index:1}
.task.done .title{flex:0 1 auto;background:var(--card);padding:0 4px;margin-left:-2px}
.task.done .tnotes{background:var(--card);width:fit-content;padding:0 4px}
.task.p-branco.done .title,.task.p-branco.done .tnotes{background:var(--card-branco)}
.task.p-pontilhado.done .title,.task.p-pontilhado.done .tnotes{background:var(--card-pontilhado)}
.task.p-denso.done .title,.task.p-denso.done .tnotes{background:var(--card-denso)}
.task.p-listras.done .title,.task.p-listras.done .tnotes{background:var(--card-listras)}
.task.p-preto.done .title,.task.p-preto.done .tnotes{background:var(--card-preto)}
.task.done .body::after{content:"";position:absolute;inset:0;background:var(--pt-light) 0 0/8px 8px;pointer-events:none}
.task.p-preto .win{background:var(--card-preto);color:var(--card-preto-ink);box-shadow:var(--bd),var(--drop),var(--preto-ring)}
html:not([data-theme="light"]) .task.p-preto .win{box-shadow:0 0 0 1px var(--urgent),var(--drop)}
[data-theme="light"] .task.p-preto .cb,
[data-theme="light"] .task.p-preto .scb{filter:invert(1)}
.task.p-preto.done .body::after{background-image:var(--pt-light-w)}
/* Escuro: padrão só na barra e nas margens. Texto em superfície opaca, por cima do pontilhado de concluída. */
html:not([data-theme="light"]) .task.p-branco{--face:var(--card-branco)}
html:not([data-theme="light"]) .task.p-pontilhado{--face:var(--card-pontilhado)}
html:not([data-theme="light"]) .task.p-denso{--face:var(--card-denso)}
html:not([data-theme="light"]) .task.p-listras{--face:var(--card-listras)}
html:not([data-theme="light"]) .task.p-preto{--face:var(--card-preto)}
html:not([data-theme="light"]) .note.p-branco{--face:var(--card-branco)}
html:not([data-theme="light"]) .note.p-pontilhado{--face:var(--card-pontilhado)}
html:not([data-theme="light"]) .note.p-denso{--face:var(--card-denso)}
html:not([data-theme="light"]) .note.p-listras{--face:var(--card-listras)}
html:not([data-theme="light"]) .note.p-preto{--face:var(--card-preto)}
html:not([data-theme="light"]) .task .row,
html:not([data-theme="light"]) .task .tnotes,
html:not([data-theme="light"]) .task .thist,
html:not([data-theme="light"]) .task .subs,
html:not([data-theme="light"]) .task .srow,
html:not([data-theme="light"]) .task .hrow,
html:not([data-theme="light"]) .task .tlog,
html:not([data-theme="light"]) .task .hcompose,
html:not([data-theme="light"]) .task .tag{
  position:relative;z-index:1;background-color:var(--face);
}
html:not([data-theme="light"]) .task .tlog{background-color:var(--input);color:var(--input-ink)}
html:not([data-theme="light"]) .task.p-preto .tlog{background-color:var(--card-preto);color:var(--card-preto-ink)}
html:not([data-theme="light"]) .task .hadd,
html:not([data-theme="light"]) .task .hmore,
html:not([data-theme="light"]) .task .hdel{position:relative;z-index:1}
html:not([data-theme="light"]) .task.done .body::after,
html:not([data-theme="light"]) .task.p-preto.done .body::after{z-index:0;background-image:var(--pt-light)}
html:not([data-theme="light"]) .note .text,
html:not([data-theme="light"]) .note .atts{position:relative;z-index:1;background-color:var(--face)}

.note{width:184px}
.note::before{content:"";position:absolute;left:7px;top:7px;width:100%;height:100%;background:var(--pt-dense) 0 0/4px 4px}
.note.dragging::before{left:12px;top:12px}
.note .paper{position:relative;min-height:184px;padding:24px 12px 14px;background:var(--card-branco);color:var(--card-ink);box-shadow:var(--bd);border-radius:var(--radius-sm);cursor:grab}
.note.p-pontilhado .paper{background:var(--card-pontilhado) var(--pt-light) 0 0/8px 8px}
.note.p-denso .paper{background:var(--card-denso) var(--pt-dense) 0 0/4px 4px}
.note.p-listras .paper{background:var(--card-listras) var(--pt-stripe) 0 0/8px 8px}
.note.p-preto .paper{background:var(--card-preto);color:var(--card-preto-ink)}
html:not([data-theme="light"]) .note.p-preto .paper{box-shadow:0 0 0 1px var(--urgent)}
.note .tape{position:absolute;top:-10px;left:50%;margin-left:-30px;width:60px;height:18px;background:var(--tag-bg) var(--pt-stripe) 0 0/8px 8px;box-shadow:var(--bd2);border-radius:var(--radius-btn)}
.note .text{font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word;min-height:118px;outline:none;cursor:text}
.note.p-pontilhado .text,.note.p-denso .text,.note.p-listras .text{background:var(--note-chip);color:var(--note-chip-ink);box-shadow:var(--bd2);padding:6px 8px;border-radius:var(--radius-btn)}
.note .fold{position:absolute;right:-3px;bottom:-3px;width:21px;height:21px;background:var(--fold) 0 0/21px 21px}
.url{position:absolute;display:flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--tag-bg);color:var(--tag-ink);box-shadow:var(--bd2);cursor:pointer;border-radius:var(--radius-btn)}
.url:hover{background:var(--on-bg);color:var(--on-ink)}
.url[hidden]{display:none}
.task .url{right:3px;top:1px;width:18px;height:14px;box-shadow:none;border:2px solid var(--line)}
.note .url{right:8px;top:7px}

.tools{position:absolute;right:-3px;top:-36px;display:flex;gap:3px;align-items:center;padding:4px;background:var(--surface);color:var(--ink);box-shadow:var(--bd2),var(--drop-tools);border-radius:var(--radius-sm);opacity:0;pointer-events:none;z-index:6}
.tools::before{content:"";position:absolute;left:0;right:0;top:100%;height:16px}
.item.tools-below .tools{top:auto;bottom:-36px}
.item.tools-below .tools::before{top:auto;bottom:100%}
.item:hover .tools,.item.tools-on .tools,#viewport.tool-select:not(.multi) .item.selected .tools{opacity:1;pointer-events:auto}
.item.dragging .tools,.item.dragging:hover .tools,#viewport.tool-select:not(.multi) .item.selected.dragging .tools{opacity:0;pointer-events:none}
.item:hover,.item.tools-on,#viewport.tool-select:not(.multi) .item.selected{z-index:100000 !important}
.tools button{width:18px;height:18px;border:none;padding:0;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--ink);border-radius:var(--radius-btn)}
.tools button.ic:hover{background:var(--on-bg);color:var(--on-ink)}
.tools .sepv{width:2px;height:16px;background:var(--line);margin:0 2px}
.editing{background:var(--input) !important;color:var(--input-ink) !important;box-shadow:0 0 0 2px var(--line) !important;user-select:text;-webkit-user-select:text;cursor:text;caret-color:var(--ink)}
[data-ph]:empty::before{content:attr(data-ph);font-weight:normal;font-style:italic;color:var(--muted)}
[data-theme="light"] [data-ph]:empty::before{color:inherit}

.llabel{position:absolute;transform:translate(-50%,-50%);background:var(--surface);color:var(--ink);padding:1px 6px;font-size:11px;font-weight:bold;white-space:pre;box-shadow:var(--bd2);outline:none;z-index:1;border-radius:var(--radius-btn)}
#viewport:not(.tool-select):not(.tool-link) .llabel{pointer-events:none}
.llabel.sel{background:var(--on-bg);color:var(--on-ink)}
.llabel:empty{display:none}
.llabel.editing{display:block;min-width:40px}

/* ---------- menus, diálogo, aviso */
#menu{position:fixed;display:none;flex-direction:column;padding:3px;z-index:70;min-width:190px}
#menu button,.dlg .btn{display:flex;align-items:center;gap:10px;border:none;background:var(--surface);color:var(--ink);padding:5px 10px;cursor:pointer;font-weight:bold;text-align:left;border-radius:var(--radius-btn)}
#menu button:hover{background:var(--on-bg);color:var(--on-ink)}
#menu .kbd{margin-left:auto;font-weight:normal;color:var(--muted)}
#dlgwrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:90;background:var(--dlg-mask) var(--pt-light) 0 0/8px 8px}
.dlg{width:min(420px,92vw)}
.dlg .in{padding:14px 16px 16px}
.dlg p{margin:0 0 10px;font-weight:bold}
.dlg input{width:100%;font:inherit;font-size:14px;padding:6px 8px;border:var(--input-border);outline:none;border-radius:var(--radius-sm);background:var(--input);color:var(--input-ink);user-select:text}
.dlg .btns{display:flex;justify-content:flex-end;gap:16px;margin-top:16px}
.dlg .btn{box-shadow:var(--bd2);padding:5px 16px}
.dlg .btn.def{box-shadow:var(--bd2),0 0 0 5px var(--focus-gap),0 0 0 8px var(--focus-ring)}
.dlg .btn:hover{background:var(--on-bg);color:var(--on-ink)}
#toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:6px 6px 6px 12px;z-index:80;font-weight:bold;text-transform:uppercase;font-size:12px}
#toast button{border:none;background:var(--on-bg);color:var(--on-ink);padding:4px 10px;cursor:pointer;font-weight:bold;border-radius:var(--radius-btn)}
#cursor{position:fixed;pointer-events:none;display:none;z-index:85;box-shadow:0 0 0 1px var(--cursor-ring),0 0 0 2px var(--cursor-gap)}
#reward{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
#reward .rpx{position:absolute;background:var(--ink);image-rendering:pixelated;animation:rburst .9s steps(6) forwards}
#reward .rstamp{position:absolute;color:var(--ink);animation:rstamp .5s steps(4) forwards;transform-origin:center}
#reward .rboa{position:absolute;color:var(--ink);animation:rboa 1s steps(5) forwards}
@keyframes rburst{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes rstamp{0%{transform:scale(2);opacity:0}40%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rboa{0%{transform:translateY(8px);opacity:0}20%{transform:translateY(-8px);opacity:1}70%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
@media (prefers-reduced-motion:reduce){
  #reward .rpx{display:none}
  #reward .rstamp,#reward .rboa{animation:rfade .45s steps(2) forwards}
  @keyframes rfade{from{opacity:0}to{opacity:1}}
}

/* ---------- rodapé */
#footer{position:fixed;left:0;right:0;bottom:0;height:36px;background:var(--surface);color:var(--muted);border-top:var(--bar-border);display:flex;align-items:center;padding:0 12px;gap:10px;z-index:50;font-size:11.5px;text-transform:uppercase;font-weight:bold;white-space:nowrap;overflow:hidden}
#footer.pan-mode{background:var(--pan-bg);color:var(--pan-ink)}
html:not([data-theme="light"]) .pwin,
html:not([data-theme="light"]) .task .win{overflow:hidden}
html:not([data-theme="light"]) ::-webkit-scrollbar{width:10px;height:10px;background:#0e0e10}
html:not([data-theme="light"]) ::-webkit-scrollbar-thumb{background:#3a3a42;border-radius:8px}
html:not([data-theme="light"]) ::selection{background:#3d4678;color:#e6e6e6}
@media (max-width: 760px){ #palette{width:46px} #palette .grid{grid-template-columns:36px} #palette .lbl{display:none} #boardwin{left:72px} #stats{display:none} }
</style>

const NS = "http://www.w3.org/2000/svg";
function pixSvg(w, h, k, draw){
  const svg=document.createElementNS(NS,"svg");

function runs(row, ox, y, add){ let x=0; while (x<row.length){ if (row[x]==="#"){ const s=x; while (x<row.length && row[x]==="#") x++; add(ox+s, y, x-s); } else x++; } }

  if (!f || !n || (f.kind!=="tasks" && f.kind!=="notes")){ renderAll(); return; }
  updateEl(n, f.item, f.kind);
  const prev=sizes.get(id);
  measureOne(id);
  const sz=sizes.get(id);
  if (!prev || !sz || prev.w!==sz.w || prev.h!==sz.h){
    if (dropRoutes(id)){ layoutLabels(); redrawInk(); }
    placeOpenTools();
  }
  renderChrome();
}
function startEdit(field, isNew, opts){
  if (!field || field.classList.contains("editing")) return;
  const isLabel=field.classList.contains("llabel");
  const id = isLabel ? field.dataset.link : field.closest(".item").dataset.id, key = isLabel ? "label" : field.dataset.field;
  const before=capture([id]);
  field.classList.add("editing");
  try { field.contentEditable="plaintext-only"; } catch(e){}
  if (field.contentEditable!=="plaintext-only") field.contentEditable="true";
  field.focus();
  const rg=document.createRange(); rg.selectNodeContents(field); const s=getSelection(); s.removeAllRanges();
  if (opts && opts.caret==="end"){ rg.collapse(false); } s.addRange(rg);
  const onInput=()=>{ followEdit(id); };
  const finish=()=>{
    cancelFollow();
    field.removeEventListener("blur",finish); field.removeEventListener("keydown",onKey); field.removeEventListener("input",onInput);
    field.contentEditable="false"; field.classList.remove("editing");
    const f=findAny(id); if (!f) return;
    let v=field.innerText.replace(/\r/g,"").replace(/\n+$/,"");
    if (key==="title"||key==="column"||key==="label") v=v.replace(/\s+/g," ").trim();
    if (key==="title" && !v) v="Nova tarefa";
    if (key==="column") v=v.slice(0,60); else if (key==="label") v=v.slice(0,200); else v=v.slice(0,5000);
    f.item[key]=v;
    const last=undoStack[undoStack.length-1];
    if (isNew && last && last.after.has(id) && !last.before.get(id).item){ // junta o texto com a criação (um Ctrl+Z desfaz tudo)
      last.after.set(id,{kind:f.kind, idx:f.idx, item:clone(f.item)}); touch(id);
    } else record(before);
    paintCard(id);
  };
  const onKey=e=>{ e.stopPropagation(); if (e.key==="Escape" || (e.key==="Enter" && !e.shiftKey && (key==="title"||key==="column"||key==="label"))){ e.preventDefault(); field.blur(); } };
  field.addEventListener("blur",finish); field.addEventListener("keydown",onKey); field.addEventListener("input",onInput);
}
function editLabel(lid){
  sel.clear(); sel.add(lid); renderSel();
  const lb=labels.get(lid); if (lb) startEdit(lb);
}

vp.addEventListener("pointermove", e => {
  updateCursor(e);
  lastMouse=toWorld(e.clientX, e.clientY);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    const h=hitAny(lastMouse); if (h!==linkHover){ linkHover=h; queuePaint(redrawInk); } else if (pendingLink || action) queuePaint(redrawInk);
  }
  if (!action) return;
  const p=lastMouse;
  if (action.type==="pinch"){
    if (pointers.size<2) return; const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    view.x+=cx-action.cx; view.y+=cy-action.cy; zoomAt(cx,cy,d/(action.d||d), true); action.d=d; action.cx=cx; action.cy=cy; return;
  }
  if (action.type==="pan"){ view.x=action.vx+e.clientX-action.sx; view.y=action.vy+e.clientY-action.sy; armMotion(); queuePaint(applyMotion); return; }
  if (action.type==="marquee"){
    const x0=Math.min(action.sx,e.clientX), y0=Math.min(action.sy,e.clientY), w=Math.abs(e.clientX-action.sx), h=Math.abs(e.clientY-action.sy);
    if (!action.moved && w+h<4) return; action.moved=true;
    const m=$("#marq"); m.style.display="block"; m.style.left=x0+"px"; m.style.top=y0+"px"; m.style.width=w+"px"; m.style.height=h+"px";
    const a=toWorld(x0,y0), R={x:a.x, y:a.y, w:w/view.z, h:h/view.z};
    sel.clear(); action.base.forEach(i=>sel.add(i));
    for (const it of board.tasks.concat(board.notes)) if (inter(rectOf(it.id), R)) sel.add(it.id);
    for (const s of board.strokes){
      const r=rectOf(s.id); if (!r || !inter(r,R)) continue;
      if (r.x>=R.x && r.y>=R.y && r.x+r.w<=R.x+R.w && r.y+r.h<=R.y+R.h){ sel.add(s.id); continue; }
      const g=strokeGeom(s), hp=g.P/2;
      for (let k=0;k<g.cells.length;k+=2){ const cx=g.ox+g.cells[k]*g.P, cy=g.oy+g.cells[k+1]*g.P; if (cx+hp>=R.x && cx-hp<=R.x+R.w && cy+hp>=R.y && cy-hp<=R.y+R.h){ sel.add(s.id); break; } }
    }
    queuePaint(renderSel); return;
  }

    if (!action.moved && Math.hypot(e.clientX-action.sx, e.clientY-action.sy)<3) return;
    if (!action.moved){ action.moved=true; action.ids.forEach(id=>{ const n=els.get(id); if (n) n.classList.add("dragging"); }); }
    const dx=snap(p.x-action.p0.x), dy=snap(p.y-action.p0.y);
    if (dx===action.dx && dy===action.dy) return; action.dx=dx; action.dy=dy;
    for (const id of action.ids){
      const f=findAny(id); if (!f) continue; const o=action.orig.get(id);
      if (f.kind==="strokes") f.item.points=o.map(q=>[q[0]+dx,q[1]+dy]);
      else { f.item.x=o.x+dx; f.item.y=o.y+dy; const n=els.get(id); n.style.left=f.item.x+"px"; n.style.top=f.item.y+"px"; patchRect(id); }
    }

  }

    const s=action.stroke, P=s.width, pts=s.points, p0=pts[0], last=pts[pts.length-1];

    pts.push(q); queuePaint(redrawInk); return;
  }

});
function endMarquee(){ $("#marq").style.display="none"; action=null; renderSel(); }
function endDrag(cancel){
  const a=action; action=null;
  a.ids.forEach(id=>{ const n=els.get(id); if (n) n.classList.remove("dragging"); });
  if (a.moved) record(a.before);
  else if (!cancel && sel.size>1 && a.clickId){ sel.clear(); sel.add(a.clickId); renderSel(); return; }
  if (a.moved){ rectsDirty=true; routeCache.clear(); linkKey=""; measure(); layoutLabels(); renderChrome(); redrawInk(); placeOpenTools(); }
}
function finishDraw(){ const s=action.stroke; action=null; const b=capture([]); board.strokes.push(s); record(b,[s.id]); bakedKey=strokeContentKey(); redrawInk(); }
function pointerEnd(e){
  pointers.delete(e.pointerId);
  flushPaint();
  if (!action) return;
  if (action.type==="pinch"){ if (pointers.size<2){ action=null; armMotion(); } return; }
  if (action.type==="pan"){ action=null; vp.classList.remove("panning"); placeOpenTools(); armMotion(); return; }
  if (action.type==="marquee"){ endMarquee(); return; }
  if (action.type==="drag"){ endDrag(false); return; }
  if (action.type==="draw"){ finishDraw(); return; }
  if (action.type==="link"){
    const a=action; action=null; const tgt=hitAny(toWorld(e.clientX, e.clientY));
    if (a.moved){ if (tgt && tgt!==a.from) createLink(a.from, tgt); pendingLink=null; }
    else if (pendingLink && pendingLink!==a.from){ createLink(pendingLink, a.from); pendingLink=null; }
    else pendingLink=a.from;
    setHint(); redrawInk();
  }
}

function isInlineImage(a){ const m=(a.mime||"").toLowerCase(); return m.startsWith("image/") && m!=="image/svg+xml" && m!=="image/svg"; }
function attUrl(a){ return "/api/attachments/"+encodeURIComponent(a.file); }
function renderAtts(n, it){

  const atts=Array.isArray(it.attachments)?it.attachments:[];

    const href=attUrl(a);

      const link=el("a","att-img",wrap); link.href=href; link.target="_blank"; link.rel="noopener noreferrer"; link.title=a.name||"";
      const img=el("img","att-thumb",link); img.src=href; img.alt=a.name||""; img.loading="lazy"; img.decoding="async";
    } else {

      link.appendChild(icon("file",2));

    }

function selectedCardId(){ if (sel.size!==1) return null; const id=[...sel][0], k=kindOf(id); return (k==="tasks"||k==="notes")?id:null; }
async function attachFiles(itemId, files){
  const it=findItem(itemId); if (!it || !files || !files.length) return;
  it.attachments = Array.isArray(it.attachments)?it.attachments:[];
  for (const f of files){
    if (it.attachments.length>=20){ toast("Máximo de 20 anexos por cartão"); break; }
    if (f.size>50*1024*1024){ toast("Arquivo grande demais (máx. 50 MB)"); continue; }
    const name=encodeURIComponent(f.name||"arquivo");
    try{
      const r=await fetch("/api/attachments?item="+encodeURIComponent(itemId)+"&name="+name, {
        method:"POST", headers:{"Content-Type": f.type||"application/octet-stream", "X-Filename": f.name||"arquivo"}, body:f
      });
      const data=await r.json().catch(()=>({}));
      if (!r.ok){ toast(data.erro||"Falha ao anexar"); continue; }
      it.attachments.push(data);
    } catch(err){ toast("Falha ao anexar"); }
  }
  renderAll();
}
async function removeAttachment(itemId, attId){
  const it=findItem(itemId); if (!it) return;
  const a=(it.attachments||[]).find(x=>x.id===attId); const label=a&&a.name?a.name:"este anexo";
  if (await dialog({title:"Remover anexo", msg:"Tirar \""+label+"\" deste cartão?"})===null) return;
  try{
    const r=await fetch("/api/attachments/"+encodeURIComponent(attId), {method:"DELETE"});
    const data=await r.json().catch(()=>({}));
    if (!r.ok){ toast(data.erro||"Não deu pra remover"); return; }
  } catch(err){ toast("Não deu pra remover"); return; }
  it.attachments=(it.attachments||[]).filter(x=>x.id!==attId);

}

      if (field.parentNode) field.remove();
      if (!v.trim()) return;
      if (f.item.history.length>=200){ toast("Limite de 200 andamentos"); return; }
      const b=capture([id]); f.item.history.push({at:new Date().toISOString(), text:v}); record(b); renderAll(); return;
    }
    if (!f.item.history[idx]){ renderAll(); return; }
    const b=capture([id]);
    if (!v.trim()) f.item.history.splice(idx,1); else f.item.history[idx]={at:f.item.history[idx].at, text:v};
    record(b); renderAll();
  };
  const onBlur=()=>close(true);
  const onKey=e=>{
    e.stopPropagation();
    if (e.key==="Escape"){ e.preventDefault(); close(false); }
    else if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); close(true); }
    else if (e.key==="Enter" && e.shiftKey){
      e.preventDefault();
      const s=getSelection(); if (!s || !s.rangeCount) return;
      const r=s.getRangeAt(0); r.deleteContents(); const t=document.createTextNode("\n"); r.insertNode(t);
      r.setStartAfter(t); r.collapse(true); s.removeAllRanges(); s.addRange(r); onInput();
    }
  };
  field.addEventListener("blur", onBlur); field.addEventListener("keydown", onKey); field.addEventListener("input", onInput);
}
function unionSubtasks(local, server){
  const loc=Array.isArray(local)?local:[], srv=Array.isArray(server)?server:[];
  const srvBy=new Map();
  for (const s of srv) if (s && typeof s.id==="string") srvBy.set(s.id, s);
  const out=[], seen=new Set();
  const push=(s, prefer)=>{
    if (!s || typeof s.id!=="string" || seen.has(s.id)) return;
    const other=prefer==="local" ? srvBy.get(s.id) : null;
    const src=prefer==="local" ? s : s;
    const text=typeof src.text==="string" ? src.text : (other && typeof other.text==="string" ? other.text : "");
    if (!String(text).trim()) return;
    seen.add(s.id);
    out.push({
      id:s.id,
      text:String(text).replace(/\r/g,"").trim().slice(0,500),
      done:!!(prefer==="local" ? src.done : s.done),
      at:typeof src.at==="string" ? src.at : (other && typeof other.at==="string" ? other.at : "")
    });
  };
  for (const s of loc) push(s, "local");
  for (const s of srv) if (!seen.has(s.id)) push(s, "server");
  return out;
}
function merge(server){
  const s=normalize(server), out={};
  for (const k of KINDS){
    const local=new Map(board[k].map(x=>[x.id,x])), sIds=new Set(), list=[];
    for (const it of s[k]){
      sIds.add(it.id); if (deleted.has(it.id)) continue;
      const keepLocal=dirty.has(it.id) && local.has(it.id);
      if (k==="tasks" && local.has(it.id)){
        const mine=local.get(it.id);
        const hist=unionHistory(mine.history, it.history);
        const subs=unionSubtasks(mine.subtasks, it.subtasks);
        if (keepLocal){ mine.history=hist; mine.subtasks=subs; }
        else { it.history=hist; it.subtasks=subs; }
      }
      list.push(keepLocal ? local.get(it.id) : it);
    }
    for (const it of board[k]) if (!sIds.has(it.id) && dirty.has(it.id)) list.push(it);
    out[k]=list;
  }
  board=out;
}
async function save(){
  if (saving){ clearTimeout(saveTimer); saveTimer=setTimeout(save,300); return; }
  if (action && (action.type==="drag"||action.type==="draw")){ saveTimer=setTimeout(save,400); return; }
  saving=true; const seq=changeSeq;
  try{
    const r=await fetch("/api/board",{method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({rev, board})});
    const data=await r.json();
    if (r.status===409){ merge(data.board); rev=data.board.rev; renderAll(); saving=false; return save(); }
    if (!r.ok) throw new Error(data.erro||r.status);
    rev=data.rev;
    if (seq===changeSeq){ dirty.clear(); deleted.clear(); setStatus("ok","Salvo"); } else scheduleSave();
  } catch(err){ setStatus("off","Sem servidor · tentando…"); clearTimeout(saveTimer); saveTimer=setTimeout(save,3000); }
  finally { saving=false; }
}
async function poll(first){
  const busy=()=>saving || dirty.size || deleted.size || action || typing();
  if (!first && (document.hidden || busy())) return;
  try{
    const headers={};
    if (rev) headers["If-None-Match"]='"'+rev+'"';
    const r=await fetch("/api/board",{cache:"no-store", headers});
    if (r.status===304){
      if (!dirty.size) setStatus("ok","Salvo");
      if (first && !localStorage.getItem("quadro.view")) fitAll();
      return;
    }
    if (!r.ok) throw 0;
    const data=await r.json();
    if (!first && (document.hidden || busy())) return;
    if (data.rev!==rev){
      const had=rev!==null; rev=data.rev; board=normalize(data);
      for (const id of [...sel]) if (!findAny(id)) sel.delete(id);
      renderAll(); setStatus("ok", had ? "Atualizado (externo)" : "Salvo");
    } else if (!dirty.size) setStatus("ok","Salvo");
    if (first && !localStorage.getItem("quadro.view")) fitAll();
  } catch(e){ setStatus("off","Servidor desligado"); }
}
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) poll(false); });
window.addEventListener("resize", ()=>{ vpBox=null; resizeInk(); });
resizeInk(); applyView(); renderAll();
poll(true); setInterval(poll, 3000);
// atalho só para depuração/testes no console (somente leitura)
window.__quadro = Object.freeze({
  get board(){ return board; }, get sel(){ return sel; }, get view(){ return view; },
  get routes(){ return board.links.map(l=>{ const r=linkRoute(l,false); return r&&{id:l.id, from:l.from, to:l.to, pts:r.pts.map(p=>({x:p.x,y:p.y}))}; }); },
  rects(){ return [...rectMap.entries()].map(([id,r])=>({id, ...r})); }
});
window.addEventListener("beforeunload", e => { if (dirty.size||deleted.size){ save(); e.preventDefault(); e.returnValue=""; } });
})();
</script>
